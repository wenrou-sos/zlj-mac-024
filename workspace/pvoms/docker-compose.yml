services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pvoms
      POSTGRES_USER: pvoms
      POSTGRES_PASSWORD: pvoms123
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pvoms"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    environment:
      DATABASE_URL: postgres://pvoms:pvoms123@db:5432/pvoms
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: change-me-in-production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
